<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Glyph chart" aria-describedby="glyph-desc"><desc id="glyph-desc">Glyph chart</desc><defs><pattern id="p-fluid" width="6" height="10" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="10" stroke="#3b4d80" stroke-width="0.5"/><line x1="3" y1="5" x2="3" y2="10" stroke="#3b4d80" stroke-width="0.5"/></pattern><pattern id="p-piston" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="5" stroke="#1f1a14" stroke-width="0.6"/></pattern></defs><rect x="0" y="0" width="1000" height="600" fill="transparent"/><rect x="0" y="0" width="1000" height="600" fill="#f5edd9"/><g transform="translate(180.000, 240.000)"><rect x="0" y="0" width="80" height="240" fill="none" stroke="#1f1a14" stroke-width="1.5"/><rect x="15" y="15" width="50" height="20" fill="rgba(31,26,20,.05)" stroke="#1f1a14" stroke-width="0.5"/><text x="40" y="29" font-size="11" fill="#4a3f30" text-anchor="middle" dominant-baseline="alphabetic">A₁ — input</text></g><g transform="translate(620.000, 180.000)"><rect x="0" y="0" width="240" height="300" fill="none" stroke="#1f1a14" stroke-width="1.5"/><rect x="15" y="15" width="210" height="20" fill="rgba(31,26,20,.05)" stroke="#1f1a14" stroke-width="0.5"/><text x="120" y="29" font-size="11" fill="#4a3f30" text-anchor="middle" dominant-baseline="alphabetic">A₂ — output (3× wider)</text></g><g transform="translate(0.000, 0.000)"><path d="M 182 316 L 182 478 L 858 478 L 858 278 L 622 278 L 622 442 L 258 442 L 258 316 Z" fill="url(#p-fluid)" stroke="#1f1a14" stroke-width="1.4"/></g><g transform="translate(184.000, 300.000)"><path d="M 0 0 L 72 0 L 72 16 L 0 16 Z" fill="url(#p-piston)" stroke="#1f1a14" stroke-width="1.6"/></g><g transform="translate(212.000, 180.000)"><path d="M 0 0 L 16 0 L 16 65 L 0 65 Z" fill="#fefce8" stroke="#1f1a14" stroke-width="1.6"/></g><g transform="translate(176.000, 160.000)"><path d="M 0 0 L 88 0 L 88 20 L 0 20 Z" fill="#fefce8" stroke="#1f1a14" stroke-width="1.6"/></g><g transform="translate(624.000, 260.000)"><path d="M 0 0 L 232 0 L 232 18 L 0 18 Z" fill="url(#p-piston)" stroke="#1f1a14" stroke-width="1.6"/></g><g transform="translate(718.000, 110.000)"><path d="M 0 0 L 44 0 L 44 78 L 0 78 Z" fill="#fefce8" stroke="#1f1a14" stroke-width="1.6"/></g><g transform="translate(604.000, 90.000)"><path d="M 0 0 L 272 0 L 272 20 L 0 20 Z" fill="#fefce8" stroke="#1f1a14" stroke-width="1.6"/></g><g transform="translate(220.000, 50.000)"><path d="M 0 0 L 0 80 M -10 65 L 0 82 L 10 65" fill="none" stroke="#b00020" stroke-width="2.4"/></g><g transform="translate(740.000, 90.000)"><path d="M 0 0 L 0 -70 M -16 -52 L 0 -74 L 16 -52" fill="none" stroke="#0b6c3a" stroke-width="4.4"/></g><g transform="translate(0.000, 0.000)"><line x1="220" y1="40" x2="140" y2="28" stroke="#4a3f30" stroke-width="0.5"/><text x="136" y="26" font-size="11" fill="#4a3f30" text-anchor="end" dominant-baseline="alphabetic">F = 1 unit</text></g><g transform="translate(0.000, 0.000)"><line x1="740" y1="10" x2="920" y2="22" stroke="#4a3f30" stroke-width="0.5"/><text x="924" y="20" font-size="11" fill="#4a3f30" text-anchor="start" dominant-baseline="alphabetic">≈ 9× the lift</text></g><g transform="translate(440.000, 90.000)"><text x="0" y="0" font-size="24" fill="#1f1a14" text-anchor="middle" dominant-baseline="middle">p  =  F₁ / A₁  =  F₂ / A₂</text></g><g transform="translate(500.000, 555.000)"><text x="0" y="0" font-size="13" fill="#4a3f30" text-anchor="middle" dominant-baseline="middle">Pressure equalizes through the fluid. A wider piston turns the same pressure into more force.</text></g></svg>
