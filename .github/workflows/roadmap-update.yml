name: roadmap-update

# Cowork-authored ROADMAP.md weekly update. Runs every Monday at
# 09:00 PT (16:00 UTC). Drops a fresh "## Cowork update — {date}"
# section at the top of ROADMAP.md with what landed in the last 7
# days and what's queued. Opens a PR rather than committing directly,
# so the human owner gets a one-click review surface.
#
# This is the workflow side of the AI-maintained promise. The
# narrative side lives in CONTRIBUTING.md#ai-maintained.

on:
  schedule:
    - cron: "0 16 * * 1"   # Mondays 16:00 UTC = 09:00 PT (PST) / 08:00 PT (PDT)
  workflow_dispatch:        # also fireable manually for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the last 7 days of merged PRs + closed issues
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          PRS=$(gh pr list --state merged --search "merged:>=${SINCE}" --limit 50 --json number,title,mergedAt --jq '.[] | "- #\(.number): \(.title)"' || echo "_(none merged in the window)_")
          ISSUES=$(gh issue list --state closed --search "closed:>=${SINCE}" --limit 50 --json number,title,closedAt --jq '.[] | "- #\(.number): \(.title)"' || echo "_(none closed in the window)_")
          OPEN_RFCs=$(gh issue list --label rfc --state open --limit 20 --json number,title --jq '.[] | "- #\(.number): \(.title)"' || echo "_(no open RFCs)_")
          {
            echo "prs<<EOF"
            echo "${PRS}"
            echo "EOF"
            echo "issues<<EOF"
            echo "${ISSUES}"
            echo "EOF"
            echo "rfcs<<EOF"
            echo "${OPEN_RFCs}"
            echo "EOF"
            echo "week=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Insert "Cowork update — {date}" section at top of ROADMAP.md
        env:
          PRS: ${{ steps.collect.outputs.prs }}
          ISSUES: ${{ steps.collect.outputs.issues }}
          RFCs: ${{ steps.collect.outputs.rfcs }}
          WEEK: ${{ steps.collect.outputs.week }}
        run: |
          set -euo pipefail
          BLOCK=$(cat <<EOF
          ## Cowork update — ${WEEK}

          > Auto-generated by \`.github/workflows/roadmap-update.yml\`. Signed by Cowork (AI maintainer).

          **Merged this week**

          ${PRS}

          **Issues closed this week**

          ${ISSUES}

          **Open RFCs**

          ${RFCs}

          ---

          EOF
          )
          # Insert after the first '---' divider in ROADMAP.md so the
          # main current-state table stays visible above the fold.
          python3 - <<PYEOF
          import os
          from pathlib import Path
          path = Path("ROADMAP.md")
          text = path.read_text()
          marker = "\n---\n"
          if marker not in text:
              path.write_text(os.environ["BLOCK"] + "\n" + text)
          else:
              head, _, tail = text.partition(marker)
              path.write_text(head + marker + "\n" + os.environ["BLOCK"] + tail)
          PYEOF

      - name: Open a PR with the update
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(roadmap): Cowork weekly update — ${{ steps.collect.outputs.week }}"
          title: "chore(roadmap): Cowork weekly update — ${{ steps.collect.outputs.week }}"
          body: |
            Auto-generated weekly Cowork update to ROADMAP.md.

            Window: last 7 days.
            - Merged PRs: see diff
            - Closed issues: see diff
            - Open RFCs: see diff

            Reviewer: one-click approve unless something looks wrong, in which case `@human` me and I'll wait for a decision.

            — Cowork (AI maintainer)
          branch: roadmap/cowork-weekly-${{ steps.collect.outputs.week }}
          delete-branch: true
          labels: |
            cowork-update
            documentation
